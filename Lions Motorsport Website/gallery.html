<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Lions Motorsport FSAE</title>
<link rel="icon" type="image/png" href="lions-symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#06090f;
    --ink-soft:#0d1420;
    --blue:#6bafdf;
    --blue-deep:#3f7fac;
    --red:#d93629;
    --red-deep:#a5271d;
    --off:#f5f4f0;
    --line: rgba(245,244,240,0.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--ink); color:var(--off); font-family:'IBM Plex Sans',sans-serif; line-height:1.6; overflow-x:hidden;}
  a{color:inherit; text-decoration:none;}
  img{display:block; max-width:100%;}
  .wrap{max-width:1240px; margin:0 auto; padding:0 32px;}

  /* speed stripe: signature three-color motif, matches the flag in the lion's mouth */
  .stripes{display:flex; height:8px;}
  .stripes span{flex:1;}
  .stripes span:nth-child(1){background:var(--blue);}
  .stripes span:nth-child(2){background:var(--red);}
  .stripes span:nth-child(3){background:var(--blue);}

  /* NAV — symbol left, links right, per the UW reference */
  header{position:fixed; top:0; left:0; right:0; z-index:100; background:rgba(6,9,15,0.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
  nav{display:flex; align-items:center; justify-content:space-between; padding:14px 32px; max-width:1240px; margin:0 auto;}
  .nav-logo{display:flex; align-items:center; padding:6px; border-radius:8px; background:radial-gradient(circle, rgba(245,244,240,0.14) 0%, rgba(245,244,240,0) 72%);}
  .nav-logo img{height:52px; width:auto;}
  .nav-links{display:flex; align-items:center; gap:36px;}
  .nav-links a{font-size:15px; font-weight:500; color:var(--off); opacity:0.85; position:relative; padding:4px 0;}
  .nav-links a:hover{opacity:1;}
  .nav-links a.active{opacity:1;}
  .nav-links a.active::after{content:""; position:absolute; left:0; right:0; bottom:-4px; height:2px; background:var(--red);}
  .nav-toggle{display:none; flex-direction:column; gap:5px; background:none; border:0; cursor:pointer; padding:6px;}
  .nav-toggle span{width:24px; height:2px; background:var(--off);}

  /* HERO */
  .hero{position:relative; min-height:100svh; display:flex; align-items:flex-end; justify-content:center; text-align:center; padding:120px 24px 90px; overflow:hidden;}
  .hero-photo{position:absolute; inset:0; z-index:0;}
  .hero-photo img{width:100%; height:100%; object-fit:cover; object-position:center 40%;}
  .hero-scrim{position:absolute; inset:0; z-index:1;
    background:linear-gradient(180deg, rgba(6,9,15,0.55) 0%, rgba(6,9,15,0.28) 30%, rgba(6,9,15,0.55) 68%, rgba(6,9,15,0.92) 100%);
  }
  .hero-inner{position:relative; z-index:2; max-width:1100px;}
  .hero-wordmark{width:min(1040px, 92vw); margin:0 auto 40px;}
  .hero-actions{display:flex; gap:16px; justify-content:center; flex-wrap:wrap;}
  .btn{display:inline-block; padding:15px 32px; font-size:15px; font-weight:600; border-radius:2px; border:1.5px solid transparent; transition:transform 0.15s ease, background 0.15s ease;}
  .btn:hover{transform:translateY(-2px);}
  .btn-outline{border-color:var(--blue); color:var(--blue);}
  .btn-outline:hover{border-color:var(--blue); background:rgba(107,175,223,0.1);}

  @media (max-width: 760px){
    .nav-links{position:fixed; top:70px; left:0; right:0; background:var(--ink-soft); flex-direction:column; align-items:flex-start; padding:20px 32px; gap:22px; border-bottom:1px solid var(--line); transform:translateY(-130%); transition:transform 0.25s ease;}
    .nav-links.open{transform:translateY(0);}
    .nav-toggle{display:flex;}
    .hero{padding-top:110px;}
  }

  /* STATS */
  .stats{padding:64px 0;}
  .stat-row{display:grid; grid-template-columns:repeat(4, 1fr); gap:24px; text-align:center;}
  .stat-num{font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:56px; line-height:1; color:var(--off);}
  .stat-label{margin-top:10px; font-size:15px; color:#9aa0ab;}

  /* JOURNEY */
  .journey{padding:96px 0;}
  .journey-grid{display:grid; grid-template-columns:1fr 1fr; gap:64px; align-items:center;}
  .journey-photo img{border-radius:4px; width:100%;}
  .journey h2{font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:44px; color:var(--off); margin-bottom:24px;}
  .journey p{color:rgba(245,244,240,0.82); font-size:16px; margin-bottom:18px; max-width:520px;}
  .journey .btn{margin-top:12px;}

  @media (max-width: 900px){
    .stat-row{grid-template-columns:repeat(2, 1fr); gap:36px 24px;}
    .journey-grid{grid-template-columns:1fr; gap:36px;}
    .journey-photo{order:2;}
    .journey p{max-width:none;}
  }

  /* FOOTER */
  footer{border-top:1px solid var(--line); padding:40px 0;}
  .footer-row{display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;}
  .footer-copy{font-size:14px; color:#9aa0ab;}
  .footer-social{display:flex; align-items:center; gap:18px;}
  .footer-social a{display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:50%; opacity:0.75; transition:opacity 0.15s ease, background 0.15s ease;}
  .footer-social a:hover{opacity:1; background:rgba(245,244,240,0.08);}
  .footer-social img{width:19px; height:19px; filter:invert(1) brightness(1.15);}

  @media (max-width: 600px){
    .footer-row{flex-direction:column; text-align:center;}
  }

  /* PAGE HEAD */
  .page-head{padding:150px 0 40px; text-align:center;}
  .page-head h1{font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:56px; color:var(--off);}

  @media (max-width: 900px){
    .page-head h1{font-size:40px;}
  }

  /* GALLERY PAGE */
  .page-head .lede{color:rgba(245,244,240,0.78); font-size:17px; max-width:640px; margin:18px auto 0;}

  .gallery-tabs{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:40px;}
  .gallery-tab{
    background:none; border:1.5px solid var(--line); color:#9aa0ab; font-family:'IBM Plex Sans',sans-serif;
    font-size:14px; font-weight:500; padding:10px 22px; border-radius:999px; cursor:pointer;
    transition:color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .gallery-tab:hover{color:var(--off); border-color:rgba(245,244,240,0.3);}
  .gallery-tab.active{color:var(--ink); background:var(--off); border-color:var(--off);}

  .gallery-section{padding:50px 0 100px;}
  .gallery-grid{columns:4 260px; column-gap:16px;}
  .gallery-item{break-inside:avoid; margin-bottom:16px; border-radius:4px; overflow:hidden; cursor:pointer; background:var(--ink-soft); position:relative;}
  .gallery-item img{width:100%; display:block; margin:0 auto; object-position:center; transition:transform 0.25s ease, filter 0.25s ease;}
  .gallery-item:hover img{transform:scale(1.035); filter:brightness(0.8);}

  @media (max-width: 900px){
    .gallery-grid{columns:2 200px;}
  }
  @media (max-width: 520px){
    .gallery-grid{columns:1;}
  }

  /* lightbox */
  .lightbox{position:fixed; inset:0; z-index:200; background:rgba(6,9,15,0.95); display:none; align-items:center; justify-content:center; padding:40px;}
  .lightbox.open{display:flex;}
  .lightbox-frame{max-width:100%; max-height:100%; display:flex; flex-direction:column; align-items:center;}
  .lightbox-frame img{max-width:100%; max-height:80vh; border-radius:4px; box-shadow:0 20px 60px rgba(0,0,0,0.5); display:block;}
  .lightbox-caption{
    margin-top:18px; font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:22px;
    color:var(--off); text-align:center; letter-spacing:0.01em; max-width:80vw;
  }
  .lightbox-close, .lightbox-prev, .lightbox-next{
    position:fixed; background:none; border:1.5px solid var(--line); color:var(--off); border-radius:50%;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover{border-color:var(--blue); background:rgba(107,175,223,0.08);}
  .lightbox-close{top:24px; right:24px;}
  .lightbox-prev{left:24px; top:50%; transform:translateY(-50%);}
  .lightbox-next{right:24px; top:50%; transform:translateY(-50%);}

  @media (max-width: 600px){
    .lightbox{padding:16px;}
    .lightbox-prev{left:10px;}
    .lightbox-next{right:10px;}
    .lightbox-close{top:14px; right:14px;}
    .lightbox-caption{font-size:18px;}
  }
</style>
</head>
<body>

<header>
  <nav>
    <a href="index.html" class="nav-logo" aria-label="Lions Motorsport home">
      <img src="lions-symbol.png" alt="Lions Motorsport symbol">
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="subteams.html">Subteams</a>
      <a href="partners.html">Partners</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
</header>

<section class="page-head">
  <div class="wrap">
    <h1>Gallery</h1>
    <p class="lede">A look behind the scenes — the build, the shop, and race day with Lions Motorsport.</p>
  </div>
</section>

<div class="stripes" aria-hidden="true"><span></span><span></span><span></span></div>

<section class="gallery-section">
  <div class="wrap">
    <div class="gallery-tabs" id="galleryTabs"></div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</section>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
  <button class="lightbox-prev" id="lbPrev" aria-label="Previous photo">&larr;</button>
  <div class="lightbox-frame">
    <img id="lbImage" src="" alt="">
    <div class="lightbox-caption" id="lbCaption"></div>
  </div>
  <button class="lightbox-next" id="lbNext" aria-label="Next photo">&rarr;</button>
</div>

<script>
  const categories = [
    {
      key: "general",
      label: "General 25-26",
      photos: [
        { src: "general2526-01.jpg", caption: "Leadership Team Picture" },
        { src: "general2526-02.jpg", caption: "Prospective Student Club Fair" }
      ]
    },
    {
      key: "development",
      label: "Development 25-26",
      photos: [
        { src: "dev2526-01.jpg", caption: "Team Next to First Chassis" },
        { src: "dev2526-02.jpg", caption: "Receiving First Set of Wheels & Tires" },
        { src: "dev2526-03.jpg", caption: "Assembling Engine Components" },
        { src: "dev2526-04.jpg", caption: "Driver Test Fit" },
        { src: "dev2526-05.jpg", caption: "Suspension on Car — Rolling for the First Time" },
        { src: "dev2526-06.jpg", caption: "Engine In Car — Completion" },
        { src: "dev2526-07.jpg", caption: "Data & Electronics Team Analyzing Tuning" }
      ]
    },
    {
      key: "comp26",
      label: "Comp 26",
      photos: [
        { src: "comp26-01.jpg", caption: "Passed Structural Integrity Tech Inspection" },
        { src: "comp26-02.jpg", caption: "Explaining Component Design to SAE Judges — Mechanical Tech Inspection" },
        { src: "comp26-03.jpg", caption: "Late Night Work — Getting Ready for Day 2" },
        { src: "comp26-04.jpg", caption: "Ready For Fuel Test" },
        { src: "comp26-05.jpg", caption: "Successful Tilt Test" },
        { src: "comp26-06.jpg", caption: "Final Completion - First FSAE Car in Program & University History" }
      ]
    }
  ];

  let activeKey = categories[0].key;
  let currentPhotos = [];

  const tabsEl = document.getElementById('galleryTabs');
  const grid = document.getElementById('galleryGrid');

  categories.forEach(cat => {
    const tab = document.createElement('button');
    tab.className = 'gallery-tab';
    tab.textContent = cat.label;
    tab.addEventListener('click', () => setActive(cat.key));
    tab.dataset.key = cat.key;
    tabsEl.appendChild(tab);
  });

  function setActive(key) {
    activeKey = key;
    [...tabsEl.children].forEach(t => t.classList.toggle('active', t.dataset.key === key));
    const cat = categories.find(c => c.key === key);
    currentPhotos = cat.photos;
    renderGrid();
  }

  function renderGrid() {
    grid.innerHTML = '';
    currentPhotos.forEach((photo, i) => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.innerHTML = `<img src="${photo.src}" alt="${photo.caption}" loading="lazy">`;
      item.addEventListener('click', () => openLightbox(i));
      grid.appendChild(item);
    });
  }

  const lightbox = document.getElementById('lightbox');
  const lbImage = document.getElementById('lbImage');
  const lbCaption = document.getElementById('lbCaption');
  let lbIndex = 0;

  function openLightbox(i) {
    lbIndex = i;
    lbImage.src = currentPhotos[lbIndex].src;
    lbCaption.textContent = currentPhotos[lbIndex].caption;
    lightbox.classList.add('open');
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
  }
  function showNext(dir) {
    lbIndex = (lbIndex + dir + currentPhotos.length) % currentPhotos.length;
    lbImage.src = currentPhotos[lbIndex].src;
    lbCaption.textContent = currentPhotos[lbIndex].caption;
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', () => showNext(-1));
  document.getElementById('lbNext').addEventListener('click', () => showNext(1));
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') showNext(-1);
    if (e.key === 'ArrowRight') showNext(1);
  });

  setActive(activeKey);
</script>

<div class="stripes" aria-hidden="true"><span></span><span></span><span></span></div>

<footer>
  <div class="wrap footer-row">
    <div class="footer-copy">&copy; 2026 Lions Motorsport &mdash; LMU Formula SAE</div>
    <div class="footer-social">
      <a href="https://www.instagram.com/lionsmotorsport/" target="_blank" rel="noopener" aria-label="Instagram">
        <img src="social-instagram.png" alt="Instagram">
      </a>
      <a href="https://www.linkedin.com/company/lionsmotorsport/posts/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <img src="social-linkedin.png" alt="LinkedIn">
      </a>
      <a href="mailto:lionsmotorsportfsae@gmail.com" aria-label="Email">
        <img src="social-email.png" alt="Email">
      </a>
    </div>
  </div>
</footer>

<script>
  const toggle = document.getElementById('navToggle');
  const links = document.getElementById('navLinks');
  toggle.addEventListener('click', () => {
    const open = links.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open);
  });
</script>

</body>
</html>
